<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Olympo Box">
<meta name="theme-color" content="#2f3237">
<title>Perfil Olympo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  body { min-height: 100dvh; display: flex; justify-content: center; padding: 28px 16px 48px; }
  main { width: 100%; max-width: 560px; }
  header .marca { color: #fff; font-size: 13px; }
  .volver { display: inline-block; margin-top: 18px; color: var(--suave); text-decoration: none; font-size: 14px; background: none; border: 0; padding: 0; }
  .cabeza { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--lila) 18%, var(--panel)); border: 2px solid color-mix(in srgb, var(--lila) 60%, transparent);
    color: var(--lila); font-size: 26px; font-weight: 700; }
  h1 { font-size: 30px; color: var(--lila); overflow-wrap: anywhere; }
  .yo { color: var(--suave); font-size: 13px; margin-top: 2px; }
  .datos { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 24px; border-top: 1px solid var(--borde); border-bottom: 1px solid var(--borde); }
  .dato { padding: 16px 4px; text-align: center; }
  .dato + .dato { border-left: 1px solid var(--borde); }
  .dato b { display: block; font-size: 24px; font-weight: 700; color: var(--texto); font-variant-numeric: tabular-nums; }
  .dato span { color: var(--suave); font-size: 12px; }
  h2 { font-size: 20px; margin: 28px 0 14px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
  .medalla { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 14px 6px 12px; border-radius: 16px; background: var(--panel); }
  .medalla-nombre { font-size: 12px; font-weight: 600; line-height: 1.3; }
  .medalla-fecha { font-size: 11px; color: var(--suave); }
  .medalla.falta .medalla-nombre { color: var(--suave); font-weight: 500; }
  .rm-titulo { display: flex; align-items: center; justify-content: space-between; }
  .rm-editar { background: none; border: 1px solid var(--borde); color: var(--lila); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 500; }
  .rm { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rm-caja { background: var(--panel); border-radius: 16px; padding: 16px; }
  .rm-caja span { display: block; color: var(--suave); font-size: 13px; }
  .rm-caja b { display: block; font-size: 30px; font-weight: 700; margin-top: 4px; color: var(--texto); font-variant-numeric: tabular-nums; }
  .rm-caja b small { font-size: 15px; font-weight: 500; color: var(--suave); margin-left: 3px; }
  .rm-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .rm-form label { display: grid; gap: 6px; font-size: 12px; color: var(--suave); }
  .rm-form input { width: 100%; background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font-size: 16px; color: var(--texto); }
  .rm-form input:focus { border-color: var(--lila); outline: none; }
  .rm-acc { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rm-guardar { background: var(--lila); color: #1f2125; border: 0; border-radius: 999px; padding: 11px 22px; font-weight: 700; font-size: 15px; }
  .rm-cancelar { background: none; border: 0; color: var(--suave); font-size: 14px; }
  .rm-msg { font-size: 14px; color: var(--error); }
  .rm-fecha { color: var(--suave); font-size: 12px; margin-top: 8px; }
  .avatar { position: relative; overflow: hidden; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .avatar.grande { width: 84px; height: 84px; font-size: 32px; }
  .avatar.con-foto { cursor: zoom-in; }
  .gustos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .gusto { background: var(--panel); border-radius: 16px; padding: 14px 16px; }
  .gusto span { display: block; color: var(--suave); font-size: 12px; }
  .gusto b { display: block; font-size: 17px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }
  .gusto.fav b { color: #7ee2a8; } .gusto.odio b { color: #ff8f8f; }
  .editar-perfil { margin-top: 14px; background: none; border: 1px solid var(--borde); color: var(--lila); border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 500; }
  .perfil-form { margin-top: 16px; border: 1px solid var(--borde); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
  .perfil-form label { display: grid; gap: 6px; font-size: 12px; color: var(--suave); }
  .perfil-form input[type=text] { width: 100%; background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font-size: 16px; color: var(--texto); outline: none; }
  .perfil-form input[type=text]:focus { border-color: var(--lila); }
  .foto-fila { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .foto-fila .boton-foto { border: 1px dashed var(--borde); border-radius: 12px; padding: 10px 14px; font-size: 14px; color: var(--texto); cursor: pointer; }
  .foto-fila .quitar { background: none; border: 0; color: var(--error); font-size: 13px; }
  .interruptor { display: flex !important; grid-template-columns: none !important; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 0; border-top: 1px solid var(--borde); font-size: 14px !important; color: var(--texto) !important; }
  .interruptor small { display: block; color: var(--suave); font-size: 12px; margin-top: 2px; }
  .interruptor input { appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--borde); position: relative; flex: none; cursor: pointer; transition: background .2s; }
  .interruptor input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .interruptor input:checked { background: var(--lila); }
  .interruptor input:checked::after { transform: translateX(18px); }
  .oculto-txt { font-size: 15px !important; }
  .zoom-foto { margin: auto; padding: 0; border: 0; background: none; max-width: min(92vw, 520px); }
  .zoom-foto::backdrop { background: rgba(0,0,0,.85); }
  .zoom-foto img { display: block; width: 100%; border-radius: 20px; }
  .vacio { color: var(--suave); padding: 24px 0; text-align: center; font-size: 15px; grid-column: 1 / -1; }
</style>
</head>
<body>
<main>
  <header>
    <div class="marca">Olympo Box</div>
  </header>
  <button type="button" class="volver" id="volver">← Volver</button>

  <div class="cabeza">
    <div class="avatar grande" id="avatar">·</div>
    <div>
      <h1 id="nombre">Cargando…</h1>
      <div class="yo" id="yo" hidden>Este es tu perfil</div>
    </div>
  </div>
  <button type="button" class="editar-perfil" id="editarPerfil" hidden>Editar perfil</button>

  <form class="perfil-form" id="perfilForm" hidden autocomplete="off">
    <div class="foto-fila">
      <div class="avatar" id="pVista">·</div>
      <label class="boton-foto" for="pFoto"><span id="pFotoTxt">Poner foto</span></label>
      <input type="file" id="pFoto" accept="image/*" hidden>
      <button type="button" class="quitar" id="pQuitar" hidden>Quitar foto</button>
    </div>
    <label>Nombre y apellido<input type="text" id="pNombre" maxlength="40" required></label>
    <label>Ejercicio favorito<input type="text" id="pFav" maxlength="40" placeholder="Ej. Thrusters"></label>
    <label>Ejercicio más odiado<input type="text" id="pOdio" maxlength="40" placeholder="Ej. Burpees"></label>
    <label class="interruptor"><span>Ocultar mis puntos<small>Los demás no verán tus puntos ni saldrás en el ranking de puntos</small></span><input type="checkbox" id="pOcultar"></label>
    <div class="rm-acc"><button type="submit" class="rm-guardar" id="pGuardar">Guardar</button><button type="button" class="rm-cancelar" id="pCancelar">Cancelar</button><span class="rm-msg" id="pMsg"></span></div>
  </form>

  <div class="gustos" id="gustos" hidden>
    <div class="gusto fav"><span>💚 Ejercicio favorito</span><b id="gFav">–</b></div>
    <div class="gusto odio"><span>💀 Ejercicio más odiado</span><b id="gOdio">–</b></div>
  </div>

  <div class="datos">
    <div class="dato"><b id="dPuntos">–</b><span>puntos</span></div>
    <div class="dato"><b id="dPuesto">–</b><span>en el ranking</span></div>
    <div class="dato"><b id="dLogros">–</b><span>logros</span></div>
  </div>

  <dialog class="zoom-foto" id="zoomFoto"><img id="zoomImg" alt=""></dialog>

  <h2 class="rm-titulo">Marcas personales <button type="button" class="rm-editar" id="rmEditar" hidden>Editar</button></h2>
  <div class="rm">
    <div class="rm-caja"><span>Snatch</span><b id="rmSnatch">–</b></div>
    <div class="rm-caja"><span>Clean &amp; Jerk</span><b id="rmCj">–</b></div>
  </div>
  <form class="rm-form" id="rmForm" hidden autocomplete="off">
    <label>Snatch (kg)<input id="fSnatch" inputmode="decimal" placeholder="Ej. 60"></label>
    <label>Clean &amp; Jerk (kg)<input id="fCj" inputmode="decimal" placeholder="Ej. 80"></label>
    <div class="rm-acc"><button type="submit" class="rm-guardar">Guardar</button><button type="button" class="rm-cancelar" id="rmCancelar">Cancelar</button><span class="rm-msg" id="rmMsg"></span></div>
  </form>
  <div class="rm-fecha" id="rmFecha"></div>

  <h2>Logros conseguidos</h2>
  <div class="rejilla" id="conseguidos"></div>

  <h2 id="tituloFaltan" hidden>Le faltan</h2>
  <div class="rejilla" id="faltan"></div>
</main>

<script type="module">
import { collection, doc, onSnapshot, query, orderBy, updateDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, fmtPuntos, crearInsignia, insigniasDe, hoy } from "./comun.js";
import { escucharCuenta } from "./cuenta.js";
import { montarMenu } from "./menu.js";

const $ = (id) => document.getElementById(id);
montarMenu({ actual: "", cuenta: false });
$("volver").addEventListener("click", () => (history.length > 1 ? history.back() : (location.href = "puntos.html")));

const uid = new URLSearchParams(location.search).get("uid");
let ficha = null, catalogo = [], ranking = [], yo = null, foto = null, dejarFoto = null, fotoNueva;

escucharCuenta(({ user }) => {
  yo = user;
  const esYo = !!user && (!uid || uid === user.uid);
  $("yo").hidden = !esYo;
  $("tituloFaltan").textContent = esYo ? "Te faltan" : "Le faltan";
  if (!uid && user) escucharFicha(user.uid);
  pintar();
});
let dejar = null;
if (uid) escucharFicha(uid);

function escucharFicha(id) {
  if (dejar) dejar();
  if (dejarFoto) dejarFoto();
  // La foto va aparte para no cargarla en cada ranking
  dejarFoto = onSnapshot(doc(db, "fotos", id), (s) => { foto = s.exists() ? s.data().img : null; pintar(); }, () => {});
  dejar = onSnapshot(doc(db, "usuarios", id), (s) => {
    if (s.exists()) ficha = { uid: s.id, ...s.data() };
    // Mi perfil aunque aún no haya registrado nada: se crea la ficha al guardar
    else if (yo && id === yo.uid) ficha = { uid: id, nombre: yo.displayName || yo.email.split("@")[0], puntos: 0, nueva: true };
    else ficha = false;
    pintar();
  }, () => { ficha = false; pintar(); });
}
onSnapshot(query(collection(db, "logros"), orderBy("orden", "asc")), (s) => { catalogo = s.docs.map((d) => ({ id: d.id, ...d.data() })); pintar(); }, () => {});
onSnapshot(query(collection(db, "usuarios"), orderBy("puntos", "desc")), (s) => { ranking = s.docs.map((d) => ({ uid: d.id, ...d.data() })).filter((u) => (u.puntos || 0) > 0); pintar(); }, () => {});

function pintar() {
  if (ficha === false) { $("nombre").textContent = "Socio no encontrado"; return; }
  if (!ficha) return;
  const nombre = ficha.nombre || "Socio";
  $("nombre").textContent = nombre;
  document.title = `${nombre} · Olympo`;
  ponerAvatar($("avatar"), nombre, foto);
  const esYo = !!yo && yo.uid === ficha.uid;
  const oculto = !!ficha.ocultarPuntos && !esYo;
  $("dPuntos").textContent = oculto ? "🔒" : fmtPuntos(ficha.puntos || 0);
  $("dPuntos").classList.toggle("oculto-txt", oculto);
  $("dPuntos").title = oculto ? "Ha ocultado sus puntos" : (ficha.ocultarPuntos ? "Tus puntos están ocultos para los demás" : "");
  $("gustos").hidden = !ficha.favorito && !ficha.odiado;
  $("gFav").textContent = ficha.favorito || "–";
  $("gOdio").textContent = ficha.odiado || "–";
  $("editarPerfil").hidden = !esYo || !$("perfilForm").hidden;
  // Puesto en el ranking de puntos (empates comparten puesto)
  let puesto = "–", p = 0, ant = null;
  ranking.filter((u) => !u.ocultarPuntos).forEach((u, i) => { if (u.puntos !== ant) { p = i + 1; ant = u.puntos; } if (u.uid === ficha.uid) puesto = p + "º"; });
  $("dPuesto").textContent = puesto;
  const mias = insigniasDe(ficha);
  $("dLogros").textContent = mias.length;

  // Marcas personales (RM)
  const rm = ficha.rm || {};
  const kg = (v) => (v ? `${String(v).replace(".", ",")}<small>kg</small>` : "–");
  $("rmSnatch").innerHTML = kg(rm.snatch);
  $("rmCj").innerHTML = kg(rm.cleanJerk);
  $("rmFecha").textContent = rm.fecha ? "Actualizado el " + new Date(rm.fecha + "T12:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" }) : "";
  $("rmEditar").hidden = !esYo || !$("rmForm").hidden;

  const c = $("conseguidos"); c.replaceChildren();
  if (!mias.length) c.append(Object.assign(document.createElement("div"), { className: "vacio", textContent: "Todavía no tiene logros." }));
  for (const m of mias) {
    const d = document.createElement("div"); d.className = "medalla";
    d.append(crearInsignia(m, 60), Object.assign(document.createElement("div"), { className: "medalla-nombre", textContent: m.nombre }));
    if (m.fecha) d.append(Object.assign(document.createElement("div"), { className: "medalla-fecha", textContent: new Date(m.fecha + "T12:00:00").toLocaleDateString("es-ES", { month: "short", year: "numeric" }) }));
    c.append(d);
  }
  const tiene = ficha.insignias || {};
  const faltan = catalogo.filter((l) => !tiene[l.id]);
  $("tituloFaltan").hidden = !faltan.length;
  const f = $("faltan"); f.replaceChildren();
  for (const l of faltan) {
    const d = document.createElement("div"); d.className = "medalla falta";
    const med = crearInsignia(l, 60); med.classList.add("bloqueada");
    d.append(med, Object.assign(document.createElement("div"), { className: "medalla-nombre", textContent: l.nombre }));
    f.append(d);
  }
}

// Avatar: la foto si la hay, si no las iniciales
function ponerAvatar(el, nombre, img) {
  el.replaceChildren();
  el.classList.toggle("con-foto", !!img);
  if (img) el.append(Object.assign(document.createElement("img"), { src: img, alt: nombre }));
  else el.textContent = (nombre || "·").trim().split(/\s+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();
}
$("avatar").addEventListener("click", () => { if (!foto) return; $("zoomImg").src = foto; $("zoomFoto").showModal(); });
$("zoomFoto").addEventListener("click", () => $("zoomFoto").close());

// ---------- Editar mi perfil: foto, nombre, ejercicios y ocultar puntos ----------
$("editarPerfil").addEventListener("click", () => {
  $("pNombre").value = ficha.nombre || ""; $("pFav").value = ficha.favorito || ""; $("pOdio").value = ficha.odiado || "";
  $("pOcultar").checked = !!ficha.ocultarPuntos;
  fotoNueva = undefined; vistaFoto();
  $("pMsg").textContent = ""; $("perfilForm").hidden = false; $("editarPerfil").hidden = true;
});
function vistaFoto() {
  const img = fotoNueva === undefined ? foto : fotoNueva;
  ponerAvatar($("pVista"), $("pNombre").value || ficha?.nombre, img);
  $("pQuitar").hidden = !img;
  $("pFotoTxt").textContent = img ? "Cambiar foto" : "Poner foto";
}
$("pNombre").addEventListener("input", vistaFoto);
$("pQuitar").addEventListener("click", () => { fotoNueva = null; vistaFoto(); });
$("pCancelar").addEventListener("click", () => { $("perfilForm").hidden = true; pintar(); });
// Recorta la foto en cuadrado y la reduce (para que ocupe poco)
$("pFoto").addEventListener("change", async () => {
  const f = $("pFoto").files[0]; $("pFoto").value = "";
  if (!f) return;
  try {
    const url = URL.createObjectURL(f);
    const im = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const lado = Math.min(im.naturalWidth, im.naturalHeight), T = 320;
    const c = document.createElement("canvas"); c.width = c.height = T;
    c.getContext("2d").drawImage(im, (im.naturalWidth - lado) / 2, (im.naturalHeight - lado) / 2, lado, lado, 0, 0, T, T);
    URL.revokeObjectURL(url);
    let q = .85, dato = c.toDataURL("image/jpeg", q);
    while (dato.length > 90000 && q > .4) { q -= .1; dato = c.toDataURL("image/jpeg", q); }
    fotoNueva = dato; vistaFoto();
  } catch (e) { console.error(e); $("pMsg").textContent = "No se ha podido leer la foto."; }
});
$("perfilForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const limpio = (t) => t.trim().replace(/\s+/g, " ").slice(0, 40);
  const nombre = limpio($("pNombre").value);
  if (nombre.length < 2) { $("pMsg").textContent = "Escribe tu nombre y apellido."; return; }
  $("pGuardar").disabled = true;
  try {
    const datos = { nombre, favorito: limpio($("pFav").value), odiado: limpio($("pOdio").value), ocultarPuntos: $("pOcultar").checked, atleta: true };
    if (ficha?.nueva) await setDoc(doc(db, "usuarios", yo.uid), { nombre, puntos: 0 });
    await updateDoc(doc(db, "usuarios", yo.uid), datos);
    if (fotoNueva === null) await deleteDoc(doc(db, "fotos", yo.uid));
    else if (fotoNueva) await setDoc(doc(db, "fotos", yo.uid), { img: fotoNueva });
    $("perfilForm").hidden = true; pintar();
  } catch (err) { console.error(err); $("pMsg").textContent = "No se ha podido guardar."; }
  $("pGuardar").disabled = false;
});

// ---------- Editar mis RM (solo en mi propio perfil) ----------
$("rmEditar").addEventListener("click", () => {
  const rm = ficha?.rm || {};
  $("fSnatch").value = rm.snatch ? String(rm.snatch).replace(".", ",") : "";
  $("fCj").value = rm.cleanJerk ? String(rm.cleanJerk).replace(".", ",") : "";
  $("rmMsg").textContent = "";
  $("rmForm").hidden = false; $("rmEditar").hidden = true;
  $("fSnatch").focus();
});
$("rmCancelar").addEventListener("click", () => { $("rmForm").hidden = true; pintar(); });
$("rmForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const leer = (id) => { const t = $(id).value.trim().replace(",", "."); if (!t) return 0; const n = parseFloat(t); return n > 0 && n <= 400 ? Math.round(n * 10) / 10 : NaN; };
  const snatch = leer("fSnatch"), cleanJerk = leer("fCj");
  if (isNaN(snatch) || isNaN(cleanJerk)) { $("rmMsg").textContent = "Escribe los kilos (por ejemplo 62,5)."; return; }
  try {
    if (ficha?.nueva) await setDoc(doc(db, "usuarios", yo.uid), { nombre: ficha.nombre.slice(0, 40), puntos: 0 });
    await updateDoc(doc(db, "usuarios", yo.uid), { rm: { snatch, cleanJerk, fecha: hoy() } });
    $("rmForm").hidden = true; pintar();
  } catch (err) { console.error(err); $("rmMsg").textContent = "No se ha podido guardar."; }
});
</script>
</body>
</html>
