name: Clases desde AimHarder

on:
  schedule:
    - cron: "17 */3 * * *"   # cada hora (a y 17)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo prueba (lee AimHarder pero no cambia ningún socio)"
        type: boolean
        default: true

# Nunca dos a la vez (el token de AimHarder cambia en cada uso)
concurrency:
  group: aimharder
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: node aimharder.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AIMHARDER_REFRESH_TOKEN: ${{ secrets.AIMHARDER_REFRESH_TOKEN }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && 'true' || 'false' }}
