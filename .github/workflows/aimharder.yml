name: Clases desde AimHarder

on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo prueba"
        type: boolean
        default: true

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar archivos
        run: |
          echo "=== ARCHIVOS EN EL REPOSITORIO ==="
          find . -maxdepth 3 -not -path '*/.*'
