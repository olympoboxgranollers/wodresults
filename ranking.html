<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Olympo Box">
<meta name="theme-color" content="#2f3237">
<title>Ranking WOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  body { min-height: 100dvh; display: flex; justify-content: center; padding: 24px 16px 56px; }
  main { width: 100%; max-width: 560px; }
  /* En pantallas anchas: el WOD en una columna lateral y la clasificación al lado */
  .cuerpo { display: flex; flex-direction: column; }
  @media (min-width: 760px) {
    main { max-width: 1000px; }
    .cuerpo { display: grid; grid-template-columns: 300px 1fr; gap: 28px; align-items: start; }
    .lateral { position: sticky; top: 24px; }
    .lateral .descripcion { margin-top: 0; font-size: 17px; }
    .cuerpo h2 { margin-top: 0; }
  }
  header { margin-bottom: 20px; }
  header .marca { color: #fff; font-size: 14px; }
  h1 { font-family: "Oswald", sans-serif; font-size: 40px; line-height: 1.05; text-transform: uppercase; margin-top: 6px; color: var(--malva); }
  .meta { color: var(--suave); margin-top: 8px; font-size: 15px; }
  header .pestanas { margin-top: 16px; }
  .directo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin-top: 10px; }
  .directo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; }
  button.directo { background: none; border: 0; padding: 0; cursor: default; }
  .directo.pausa { color: var(--texto); cursor: pointer; background: var(--panel); border: 1px solid var(--borde); border-radius: 999px; padding: 6px 12px; }
  .directo.pausa::before { background: var(--suave); }
  .descripcion { text-transform: uppercase; margin-top: 14px; background: var(--panel); border: 1px solid var(--borde); border-left: 4px solid var(--malva); border-radius: 12px; padding: 14px 16px; font-size: 16px; line-height: 1.5; white-space: pre-line; }
  .descripcion b { display: block; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--malva); font-size: 13px; margin-bottom: 4px; font-weight: 600; }
  h2 { font-family: "Oswald", sans-serif; text-transform: uppercase; font-size: 22px; letter-spacing: .08em; margin: 26px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font-size: 13px; color: var(--suave); font-family: "Inter", sans-serif; letter-spacing: 0; text-transform: none; }
  .filtros { display: flex; gap: 8px; margin-bottom: 12px; }
  .filtros button { background: var(--panel); border: 1px solid var(--borde); color: var(--texto); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
  .filtros button[aria-pressed="true"] { background: var(--malva); color: #1f2125; border-color: var(--malva); }
  ol { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; font-size: 17px; }
  li .pos { font-family: "Oswald", sans-serif; font-size: 22px; color: var(--suave); text-align: center; }
  li .nom { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .emoji { margin-left: 6px; width: 24px; height: 24px; font-size: 20px; line-height: 24px; vertical-align: middle; display: inline-block; }
  li .res { font-family: "Oswald", sans-serif; font-size: 22px; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.05; }
  li .pesos { display: block; text-transform: none; letter-spacing: 0; color: var(--suave); font-weight: 600; margin-top: 1px; }
  li .cat { display: block; font-family: "Inter", sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--malva); margin-top: 3px; }
  /* El recuadro de cada atleta lleva el color de la clase: WOD lila, Hyrox amarillo, Funcional cian */
  li { border-color: color-mix(in srgb, var(--malva) 55%, transparent) !important; background: color-mix(in srgb, var(--malva) 7%, var(--panel)); }
  li.p1 { border-color: var(--malva) !important; box-shadow: 0 0 0 1px var(--malva), 0 0 18px color-mix(in srgb, var(--malva) 30%, transparent); } li.p1 .pos { color: var(--oro); }
  li.p2 .pos { color: var(--plata); } li.p3 .pos { color: var(--bronce); }
  li.nuevo { animation: entra 1.6s ease-out; }
  @keyframes entra { 0% { background: var(--malva); } 100% { background: var(--panel); } }
  @media (prefers-reduced-motion: reduce) { li.nuevo { animation: none; } }
  .vacio { color: var(--suave); background: var(--panel); border: 1px dashed var(--borde); border-radius: 12px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <div class="marca" id="box">Resultados atletas</div>
    <h1 id="wodNombre">WOD del día</h1>
    <div class="meta" id="tipo"></div>
    <button type="button" class="directo" id="directo">En directo</button>
    <nav class="pestanas" id="pestanas" aria-label="Clase"></nav>
  </header>

  <div class="cuerpo">
  <aside class="lateral">
    <div class="descripcion" id="descripcion" hidden><b>El WOD</b><span id="descripcionTexto"></span></div>
  </aside>
  <section>
  <h2>Clasificación <small id="nAtletas"></small></h2>
  <div class="filtros" id="filtros">
    <button type="button" data-v="todos" aria-pressed="true">Todos</button>
    <button type="button" data-v="RX" aria-pressed="false">RX</button>
    <button type="button" data-v="Scaled" aria-pressed="false">Scaled</button>
    <button type="button" data-v="Open" aria-pressed="false">Open</button>
  </div>
  <ol id="lista"></ol>
  </section>
  </div>
</main>
<div class="fecha-hoy" id="fecha"></div>

<script type="module">
// Página solo de lectura: muestra el WOD y la clasificación del día. No escribe ni borra nada.
import { doc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, hoy, TIPOS, formatearValor, ordenar, posiciones, crearEmoji, lideres, mensajesDeLider, aviso, textoPesos, CLASES, idWod, claseDe, claseInicial, recordarClase, ponerColorClase, crearPestanas } from "./comun.js";
import { montarMenu, abrirEditor } from "./menu.js";

const $ = (id) => document.getElementById(id);
$("box").textContent = "Resultados atletas";
$("fecha").textContent = new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

let clase = claseInicial();
let esCoach = false;
const menu = montarMenu({ actual: "ranking", cuenta: false, alCambiar: ({ coach }) => { esCoach = coach; pintar(); } });
let wod = null;
let todos = [];        // resultados de hoy de todas las clases
let resultados = [];   // solo los de la clase elegida
let filtro = "todos";
const vistos = new Set();
let primeraCarga = true;
let lideresAntes = null;
const cargado = { wod: false, res: false };
let lideresAntesTipo = null;

$("filtros").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  filtro = b.dataset.v;
  $("filtros").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  pintar();
});

function pintar() {
  const tipo = wod?.tipo || "tiempo";
  const validos = wod ? resultados.filter((r) => (r.tipo || tipo) === tipo) : [];
  const lista = ordenar(validos, tipo).filter((r) => filtro === "todos" || r.categoria === filtro);
  const ol = $("lista");
  ol.replaceChildren();
  $("nAtletas").textContent = lista.length ? `${lista.length} atleta${lista.length > 1 ? "s" : ""}` : "";
  if (!lista.length) {
    const v = document.createElement("div");
    v.className = "vacio";
    v.textContent = wod ? "Todavía no hay resultados" : `El entrenamiento de ${CLASES[clase].nombre} de hoy aún no está publicado`;
    ol.append(v);
  }
  const pos = posiciones(lista);
  lista.forEach((r, i) => {
    const li = document.createElement("li");
    if (pos[i] <= 3) li.classList.add("p" + pos[i]);
    if (!primeraCarga && !vistos.has(r.id)) li.classList.add("nuevo");
    const num = document.createElement("span"); num.className = "pos"; num.textContent = pos[i];
    const nom = document.createElement("span"); nom.className = "nom"; nom.textContent = r.nombre;
    const em = crearEmoji(r.sensacion);
    if (em) nom.append(em);
    const res = document.createElement("span"); res.className = "res"; res.textContent = formatearValor(r.valor, r.tipo || tipo);
    const cat = document.createElement("span"); cat.className = "cat"; cat.textContent = r.categoria;
    const tp = r.categoria === "Open" ? textoPesos(r.pesos) : "";
    if (tp) { const pe = document.createElement("span"); pe.className = "pesos"; pe.textContent = tp; cat.append(pe); }
    res.append(cat);
    li.append(num, nom, res);
    // Con la cuenta del coach, tocar un resultado abre el editor (corregir, validar o borrar)
    if (esCoach && r.id && !r.id.startsWith("_")) { li.classList.add("editable"); li.addEventListener("click", () => abrirEditor(r, r.tipo || tipo)); }
    ol.append(li);
  });
  // Pique: avisa cuando cambia el líder o hay empate en cabeza
  // (solo cuando ya han llegado el WOD y los resultados, para no avisar al abrir la página)
  if (wod && cargado.wod && cargado.res) {
    const ahora = lideres(resultados, tipo);
    if (lideresAntes) mensajesDeLider(lideresAntes, ahora).forEach(aviso);
    lideresAntes = ahora;
  }
  resultados.forEach((r) => vistos.add(r.id));
  if (cargado.res) primeraCarga = false;  // no resaltar como "nuevos" los que ya estaban al abrir
}

let dejarWod = null;
function escucharWod() {
  if (dejarWod) dejarWod();
  dejarWod = onSnapshot(doc(db, "wods", idWod(clase)), (snap) => {
  wod = snap.exists() ? snap.data() : null;
  if (wod?.tipo !== lideresAntesTipo) { lideresAntes = null; lideresAntesTipo = wod?.tipo; }
  cargado.wod = true;
  $("wodNombre").textContent = wod?.nombre || `${CLASES[clase].nombre} del día`;
  $("tipo").textContent = wod ? TIPOS[wod.tipo]?.etiqueta || "" : "";
  $("descripcionTexto").textContent = wod?.descripcion || "";
  $("descripcion").hidden = !wod?.descripcion;
  pintar();
  });
}

// ---------- Resultados en directo, gastando las mínimas lecturas ----------
// - Solo se leen los resultados de la clase que se está viendo (no los de las tres).
// - Si la pestaña se queda en segundo plano más de 1 minuto, se desconecta.
// - Si nadie toca la página en 15 minutos, se pone en pausa; un toque la vuelve a poner en directo.
let dejarRes = null;
function conectar() {
  desconectar();
  cargado.res = false;
  dejarRes = onSnapshot(query(collection(db, "resultados"), where("fecha", "==", hoy()), where("clase", "==", clase)), (snap) => {
    todos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    resultados = todos;
    cargado.res = true;
    pintar();
  });
  marcarDirecto(true);
}
function desconectar() { if (dejarRes) { dejarRes(); dejarRes = null; } }
function marcarDirecto(enDirecto) {
  const d = $("directo");
  d.classList.toggle("pausa", !enDirecto);
  d.textContent = enDirecto ? "En directo" : "En pausa · Pulsa para actualizar";
}
function pausar() { if (!dejarRes) return; desconectar(); marcarDirecto(false); }

let ultimoToque = Date.now(), temporizadorOculto = null;
for (const ev of ["pointerdown", "keydown", "scroll", "touchstart"]) {
  addEventListener(ev, () => { ultimoToque = Date.now(); if (!dejarRes && document.visibilityState === "visible") conectar(); }, { passive: true });
}
setInterval(() => { if (dejarRes && Date.now() - ultimoToque > 15 * 60 * 1000) pausar(); }, 30 * 1000);
document.addEventListener("visibilitychange", () => {
  clearTimeout(temporizadorOculto);
  if (document.visibilityState === "hidden") temporizadorOculto = setTimeout(pausar, 60 * 1000);
  else { ultimoToque = Date.now(); if (!dejarRes) conectar(); }
});
$("directo").addEventListener("click", () => { if (!dejarRes) conectar(); });

function cambiarClase(nueva) {
  clase = nueva;
  recordarClase(clase);
  ponerColorClase(clase);
  menu.repintar();
  wod = null; cargado.wod = false; lideresAntes = null; lideresAntesTipo = null; primeraCarga = true;
  todos = []; resultados = [];
  $("wodNombre").textContent = `${CLASES[clase].nombre} del día`; $("tipo").textContent = ""; $("descripcion").hidden = true;
  pintar();
  escucharWod();
  conectar();
}
crearPestanas($("pestanas"), clase, cambiarClase);
cambiarClase(clase);

// A medianoche recarga para mostrar el día nuevo
const ahora = new Date();
const manana = new Date(ahora); manana.setHours(24, 1, 0, 0);
setTimeout(() => location.reload(), manana - ahora);
</script>
</body>
</html>
