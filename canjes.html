<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Olympo Box">
<meta name="theme-color" content="#2f3237">
<title>Canjes Olympo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  body { min-height: 100dvh; display: flex; justify-content: center; padding: 28px 16px 48px; }
  main { width: 100%; max-width: 560px; }
  header .marca { color: #fff; font-size: 13px; }
  h1 { font-family: "Inter", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.02em; margin-top: 14px; color: var(--lila); }
  .sub { color: var(--suave); margin-top: 6px; font-size: 15px; line-height: 1.5; }

  /* Saldo */
  .saldo { margin-top: 26px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--borde); }
  .saldo > span { color: var(--suave); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .saldo b { font-family: "Inter", sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -.02em; color: var(--lila); font-variant-numeric: tabular-nums; }
  .saldo b small { font-size: 15px; font-weight: 600; color: var(--suave); margin-left: 4px; letter-spacing: 0; }

  /* Catálogo */
  .lista { list-style: none; margin-top: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; padding: 20px 0; border-bottom: 1px solid var(--borde); }
  .item:last-child { border-bottom: 0; }
  .item-nombre { font-size: 17px; font-weight: 600; }
  .item-desc { grid-column: 1 / 2; color: var(--suave); font-size: 14px; line-height: 1.45; }
  .item-coste { grid-row: 1 / 3; grid-column: 2; text-align: right; align-self: start; }
  .item-coste b { display: block; font-weight: 800; font-size: 20px; color: var(--texto); font-variant-numeric: tabular-nums; }
  .item-coste small { color: var(--suave); font-size: 12px; }
  .item-barra { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--borde); overflow: hidden; margin-top: 8px; }
  .item-barra i { display: block; height: 100%; background: var(--lila); border-radius: 4px; transition: width .6s ease; }
  .item-estado { grid-column: 1 / -1; font-size: 13px; color: var(--suave); }
  .item.alcanzable .item-estado { color: var(--lila); font-weight: 600; }
  .item.alcanzable .item-coste b { color: var(--lila); }
  .item.con-foto .item-foto, .item.con-foto .item-nombre { cursor: zoom-in; }
  .zoom { margin: auto; padding: 0; border: 0; background: transparent; width: min(560px, 94vw); color: var(--texto); }
  .zoom::backdrop { background: rgba(10,10,12,.85); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .zoom img { display: block; width: 100%; max-height: 70vh; object-fit: contain; border-radius: 18px; background: var(--panel); }
  .zoom-info { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; }
  .zoom-info b { font-size: 18px; }
  .zoom-info span { color: var(--lila); font-weight: 800; white-space: nowrap; }
  .zoom p { color: var(--suave); font-size: 14px; margin-top: 4px; line-height: 1.45; }
  .zoom-cerrar { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 16px; }
  .zoom-caja { position: relative; }
  .item-acciones { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 6px; }
  .item-acciones button { background: none; border: 1px solid var(--borde); color: var(--suave); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
  .item-acciones .borrar { color: var(--error); }
  .foto { display: flex; align-items: center; gap: 12px; }
  .foto img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; border: 1px solid var(--borde); }
  .foto-boton { cursor: pointer; border: 1px dashed var(--borde); border-radius: 12px; padding: 12px 16px; color: var(--texto) !important; font-size: 14px !important; display: inline-block !important; }
  .foto-quitar { background: none; border: 0; color: var(--suave); font-size: 13px; }
  .item.con-foto { grid-template-columns: 64px 1fr auto; }
  .item-foto { grid-row: 1 / 3; width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: var(--panel); }
  .item.con-foto .item-desc { grid-column: 2 / 3; }
  .item.con-foto .item-coste { grid-column: 3; }
  .entrega { grid-column: 1 / -1; display: grid; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--panel); }
  .entrega select { width: 100%; background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font-size: 15px; color: var(--texto); }
  .entrega .guardar { background: var(--lila); color: #1f2125; border: 0; border-radius: 999px; padding: 12px; font-weight: 800; font-size: 15px; }
  .entrega .guardar:disabled { opacity: .5; }
  .vacio { color: var(--suave); padding: 36px 0; text-align: center; font-size: 15px; }
  .nota { margin-top: 26px; color: var(--suave); font-size: 13px; line-height: 1.55; }

  /* Formulario del coach */
  .nuevo { margin-top: 26px; border: 1px solid var(--borde); border-radius: 16px; padding: 18px; }
  .nuevo-titulo { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
  .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .campos .ancho { grid-column: 1 / -1; }
  .campos label { display: grid; gap: 6px; font-size: 12px; color: var(--suave); }
  .campos input { width: 100%; background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font-size: 16px; color: var(--texto); outline: none; }
  .campos input:focus { border-color: var(--lila); }
  .nuevo-acciones { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .nuevo-acciones .guardar { background: var(--lila); color: #1f2125; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 800; font-size: 15px; }
  .nuevo-acciones .cancelar { background: none; border: 0; color: var(--suave); font-size: 14px; }
  .msg { font-size: 14px; }
  .msg.ok { color: #3ddc84; } .msg.error { color: var(--error); }
</style>
</head>
<body>
<main>
  <header>
    <div class="marca">Olympo Box</div>
    <h1>Canjes</h1>
    <p class="sub">Lo que puedes conseguir con tus puntos.</p>
  </header>

  <div class="saldo" id="saldo">
    <span>Tus puntos</span>
    <b><span id="misPuntos">0</span><small>pts</small></b>
  </div>

  <!-- Solo el coach -->
  <form class="nuevo" id="nuevo" hidden autocomplete="off">
    <div class="nuevo-titulo" id="nuevoTitulo">Añadir objeto</div>
    <div class="campos">
      <label class="ancho">Nombre<input id="fNombre" maxlength="60" placeholder="Ej. Camiseta Olympo" required></label>
      <label class="ancho">Descripción (opcional)<input id="fDesc" maxlength="140" placeholder="Ej. Algodón, tallas S–XL"></label>
      <div class="ancho foto">
        <img id="fVista" alt="" hidden>
        <label class="foto-boton" for="fImagen"><span id="fImagenTexto">Añadir foto</span></label>
        <input type="file" id="fImagen" accept="image/*" hidden>
        <button type="button" class="foto-quitar" id="fQuitar" hidden>Quitar</button>
      </div>
      <label>Precio (€)<input id="fPrecio" inputmode="decimal" placeholder="20"></label>
      <label>Coste (puntos)<input id="fPuntos" inputmode="numeric" placeholder="500" required></label>
    </div>
    <div class="nuevo-acciones">
      <button type="submit" class="guardar" id="fGuardar">Añadir</button>
      <button type="button" class="cancelar" id="fCancelar" hidden>Cancelar</button>
      <span class="msg" id="fMsg" role="status"></span>
    </div>
  </form>

  <ul class="lista" id="lista"><li class="vacio">Cargando…</li></ul>

  <p class="nota" id="nota">Para canjear un objeto, díselo al coach en el box. Él te lo entregará y descontará los puntos.</p>
</main>

<dialog class="zoom" id="zoom" aria-label="Foto del objeto">
  <div class="zoom-caja">
    <img id="zoomImg" alt="">
    <button type="button" class="zoom-cerrar" id="zoomCerrar" aria-label="Cerrar">✕</button>
  </div>
  <div class="zoom-info"><b id="zoomNombre"></b><span id="zoomPuntos"></span></div>
  <p id="zoomDesc"></p>
</dialog>

<script type="module">
import { collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, fmtPuntos, hoy } from "./comun.js";
import { escucharCuenta } from "./cuenta.js";
import { montarMenu, esCuentaCoach } from "./menu.js";

const $ = (id) => document.getElementById(id);
montarMenu({ actual: "canjes", cuenta: false });

let user = null, coach = false, puntos = 0, objetos = [], editando = null, abierto = null;
let imagen = null;  // foto del objeto (ya reducida), o null

escucharCuenta(({ user: u, ficha }) => {
  user = u;
  coach = esCuentaCoach(u);
  puntos = ficha?.puntos || 0;
  $("misPuntos").textContent = fmtPuntos(puntos);
  $("saldo").hidden = coach;
  $("nuevo").hidden = !coach;
  $("nota").textContent = coach
    ? "Los socios ven este catálogo y cuántos puntos les faltan. Cuando entregues un objeto, pulsa Entregar y elige al socio: se le descuentan los puntos y queda en su historial."
    : "Para canjear un objeto, díselo al coach en el box. Él te lo entregará y descontará los puntos.";
  if (coach && !dejarSocios) escucharSocios();
  pintar();
});

// Lista de socios (solo para el coach, para entregar canjes)
let socios = [], dejarSocios = null;
function escucharSocios() {
  dejarSocios = onSnapshot(query(collection(db, "usuarios"), orderBy("nombre", "asc")), (s) => {
    socios = s.docs.map((d) => ({ uid: d.id, ...d.data() })).filter((x) => x.nombre);
    pintar();
  }, () => {});
}

onSnapshot(query(collection(db, "canjeables"), orderBy("puntos", "asc")), (s) => {
  objetos = s.docs.map((d) => ({ id: d.id, ...d.data() }));
  pintar();
}, () => { $("lista").innerHTML = '<li class="vacio">No se ha podido cargar el catálogo.</li>'; });

const euros = (n) => n ? n.toLocaleString("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: n % 1 ? 2 : 0 }) : "";

function pintar() {
  const ul = $("lista"); ul.replaceChildren();
  if (!objetos.length) {
    ul.append(Object.assign(document.createElement("li"), { className: "vacio", textContent: coach ? "Todavía no hay objetos. Añade el primero arriba." : "Pronto habrá objetos para canjear." }));
    return;
  }
  for (const o of objetos) {
    const li = document.createElement("li"); li.className = "item" + (o.imagen ? " con-foto" : "");
    if (o.imagen) {
      const im = Object.assign(document.createElement("img"), { className: "item-foto", src: o.imagen, alt: o.nombre, loading: "lazy" });
      im.addEventListener("click", () => verFoto(o));
      li.append(im);
    }
    const falta = Math.max(0, o.puntos - puntos);
    if (!coach && falta === 0) li.classList.add("alcanzable");
    const nom = Object.assign(document.createElement("div"), { className: "item-nombre", textContent: o.nombre });
    if (o.imagen) nom.addEventListener("click", () => verFoto(o));
    li.append(nom);
    const coste = document.createElement("div"); coste.className = "item-coste";
    coste.append(Object.assign(document.createElement("b"), { textContent: `${fmtPuntos(o.puntos)} pts` }));
    if (o.precio) coste.append(Object.assign(document.createElement("small"), { textContent: `valor ${euros(o.precio)}` }));
    li.append(coste);
    if (o.descripcion) li.append(Object.assign(document.createElement("div"), { className: "item-desc", textContent: o.descripcion }));
    if (!coach) {
      const barra = document.createElement("div"); barra.className = "item-barra";
      const i = document.createElement("i"); i.style.width = Math.min(100, (puntos / o.puntos) * 100) + "%";
      barra.append(i); li.append(barra);
      li.append(Object.assign(document.createElement("div"), { className: "item-estado", textContent: falta === 0 ? "Ya lo puedes canjear" : `Te faltan ${fmtPuntos(falta)} pts` }));
    } else {
      const acc = document.createElement("div"); acc.className = "item-acciones";
      const ed = Object.assign(document.createElement("button"), { type: "button", textContent: "Editar" });
      ed.addEventListener("click", () => editar(o));
      const bo = Object.assign(document.createElement("button"), { type: "button", className: "borrar", textContent: "Borrar" });
      let seguro = false;
      bo.addEventListener("click", async () => {
        if (!seguro) { seguro = true; bo.textContent = "¿Seguro?"; setTimeout(() => { seguro = false; bo.textContent = "Borrar"; }, 4000); return; }
        try { await deleteDoc(doc(db, "canjeables", o.id)); } catch (e) { console.error(e); mensaje("No se ha podido borrar.", true); }
      });
      const en = Object.assign(document.createElement("button"), { type: "button", textContent: "Entregar" });
      en.addEventListener("click", () => { abierto = abierto === o.id ? null : o.id; pintar(); });
      acc.append(en, ed, bo); li.append(acc);
      if (abierto === o.id) li.append(panelEntrega(o));
    }
    ul.append(li);
  }
}

// Entregar un objeto: elegir socio y descontarle los puntos
function panelEntrega(o) {
  const box = document.createElement("div"); box.className = "entrega";
  const sel = document.createElement("select");
  sel.setAttribute("aria-label", "Socio");
  const llegan = socios.filter((x) => (x.puntos || 0) >= o.puntos);
  sel.append(new Option(llegan.length ? "Elige el socio…" : "Ningún socio tiene puntos suficientes", ""));
  for (const x of llegan) sel.append(new Option(`${x.nombre} · ${fmtPuntos(x.puntos || 0)} pts`, x.uid));
  const ok = Object.assign(document.createElement("button"), { type: "button", className: "guardar", textContent: `Descontar ${fmtPuntos(o.puntos)} pts` });
  const m = Object.assign(document.createElement("span"), { className: "msg" });
  ok.addEventListener("click", async () => {
    const s = socios.find((x) => x.uid === sel.value);
    if (!s) { m.className = "msg error"; m.textContent = "Elige un socio."; return; }
    ok.disabled = true;
    try {
      const lote = writeBatch(db);
      lote.update(doc(db, "usuarios", s.uid), { puntos: increment(-o.puntos) });
      lote.set(doc(collection(db, "usuarios", s.uid, "movimientos")), { fecha: hoy(), tipo: "canje", objeto: o.nombre, puntos: -o.puntos });
      await lote.commit();
      abierto = null; mensaje(`✓ ${o.nombre} entregado a ${s.nombre}: −${fmtPuntos(o.puntos)} pts`);
      pintar();
    } catch (e) { console.error(e); m.className = "msg error"; m.textContent = "No se ha podido descontar."; ok.disabled = false; }
  });
  box.append(sel, ok, m);
  return box;
}

// ---------- Foto del objeto: se reduce en el móvil (máx. 640 px, JPEG) y se guarda con el objeto ----------
function ponerImagen(src) {
  imagen = src;
  $("fVista").hidden = !src; if (src) $("fVista").src = src;
  $("fQuitar").hidden = !src;
  $("fImagenTexto").textContent = src ? "Cambiar foto" : "Añadir foto";
}
function reducir(file) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 640, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d");
      g.fillStyle = "#2f3237"; g.fillRect(0, 0, c.width, c.height);  // fondo para PNG transparentes
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.78, d = c.toDataURL("image/jpeg", q);
      while (d.length > 250000 && q > 0.4) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("imagen")); };
    img.src = url;
  });
}
$("fImagen").addEventListener("change", async (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  try { ponerImagen(await reducir(f)); mensaje(""); }
  catch { mensaje("No se ha podido leer la foto. Prueba con otra (JPG o PNG).", true); }
  e.target.value = "";
});
$("fQuitar").addEventListener("click", () => ponerImagen(null));

// Ver la foto en grande al tocar el producto
function verFoto(o) {
  $("zoomImg").src = o.imagen; $("zoomImg").alt = o.nombre;
  $("zoomNombre").textContent = o.nombre;
  $("zoomPuntos").textContent = `${fmtPuntos(o.puntos)} pts`;
  $("zoomDesc").textContent = o.descripcion || "";
  $("zoom").showModal();
}
$("zoomCerrar").addEventListener("click", () => $("zoom").close());
$("zoom").addEventListener("click", (e) => { if (e.target === $("zoom")) $("zoom").close(); });

function mensaje(t, error = false) { $("fMsg").className = "msg " + (error ? "error" : "ok"); $("fMsg").textContent = t; }

function editar(o) {
  editando = o.id;
  $("fNombre").value = o.nombre; $("fDesc").value = o.descripcion || "";
  $("fPrecio").value = o.precio ? String(o.precio).replace(".", ",") : ""; $("fPuntos").value = o.puntos;
  ponerImagen(o.imagen || null);
  $("nuevoTitulo").textContent = "Editar objeto"; $("fGuardar").textContent = "Guardar"; $("fCancelar").hidden = false;
  mensaje("");
  window.scrollTo({ top: $("nuevo").offsetTop - 20, behavior: "smooth" });
}
function limpiar() {
  editando = null; $("nuevo").reset(); ponerImagen(null);
  $("nuevoTitulo").textContent = "Añadir objeto"; $("fGuardar").textContent = "Añadir"; $("fCancelar").hidden = true;
}
$("fCancelar").addEventListener("click", () => { limpiar(); mensaje(""); });

$("nuevo").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nombre = $("fNombre").value.trim();
  const descripcion = $("fDesc").value.trim();
  const precioTxt = $("fPrecio").value.trim().replace(",", ".");
  const precio = precioTxt ? parseFloat(precioTxt) : 0;
  const pts = parseInt($("fPuntos").value.trim(), 10);
  if (!nombre) return mensaje("Escribe el nombre.", true);
  if (isNaN(precio) || precio < 0 || precio > 100000) return mensaje("Revisa el precio.", true);
  if (!(pts > 0) || pts > 1000000) return mensaje("Escribe el coste en puntos.", true);
  const datos = { nombre, descripcion, precio: Math.round(precio * 100) / 100, puntos: pts, imagen: imagen || "" };
  try {
    if (editando) await updateDoc(doc(db, "canjeables", editando), datos);
    else await addDoc(collection(db, "canjeables"), { ...datos, creado: serverTimestamp() });
    mensaje(editando ? "✓ Guardado" : "✓ Añadido");
    limpiar();
  } catch (err) { console.error(err); mensaje(err?.code === "permission-denied" ? "Solo la cuenta del coach puede añadir objetos." : "No se ha podido guardar.", true); }
});
</script>
</body>
</html>
