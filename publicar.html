<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Publicar WOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  body { min-height: 100dvh; display: flex; justify-content: center; padding: 24px 16px 48px; }
  main { width: 100%; max-width: 640px; }
  header .marca { color: #fff; font-size: 14px; }
  h1 { font-family: "Oswald", sans-serif; font-size: 40px; line-height: 1.05; text-transform: uppercase; margin-top: 6px; color: var(--malva); }
  .sub { color: var(--suave); margin-top: 8px; font-size: 15px; }
  .pestanas { margin: 22px 0 18px; display: grid; grid-template-columns: repeat(3, 1fr); }
  .pestanas button { padding: 12px 4px; letter-spacing: .04em; white-space: nowrap; border-radius: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--borde); border-top: 4px solid var(--malva); border-radius: 16px; padding: 20px 18px; }
  .estado-wod { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--suave); }
  .estado-wod::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--borde); }
  .estado-wod.publicado { color: var(--texto); }
  .estado-wod.publicado::before { background: #3ddc84; }
  label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--suave); margin: 18px 0 7px; letter-spacing: .06em; }
  input, select, textarea { width: 100%; background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font-size: 16px; color: var(--texto); outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--malva); }
  textarea { text-transform: uppercase; resize: vertical; line-height: 1.45; min-height: 190px; font-family: inherit; }
  .acciones { display: flex; gap: 10px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
  .guardar { flex: 1; min-width: 180px; background: var(--malva); color: #1f2125; border: 0; border-radius: 12px; padding: 15px; font-family: "Oswald", sans-serif; font-size: 19px; text-transform: uppercase; letter-spacing: .06em; }
  .guardar:disabled { opacity: .5; }
  .msg { font-size: 14px; min-height: 1.2em; }
  .msg.ok { color: #3ddc84; } .msg.error { color: var(--error); }
  .enlaces { margin-top: 26px; display: grid; gap: 8px; }
  .enlaces a { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; color: var(--texto); text-decoration: none; font-weight: 600; font-size: 15px; }
  .enlaces a span { color: var(--suave); font-weight: 400; font-size: 13px; }
  .resumen { margin-top: 22px; display: grid; gap: 8px; }
  .fila-resumen { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; font-size: 14px; }
  .fila-resumen b { font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .06em; }
  .fila-resumen span { color: var(--suave); }
  .cierre { margin-top: 18px; border-top-color: var(--lila); }
  .cierre-titulo { font-family: "Oswald", sans-serif; text-transform: uppercase; font-size: 22px; letter-spacing: .04em; }
  .cierre-texto { color: var(--suave); font-size: 14px; line-height: 1.5; margin-top: 6px; }
  .cierre .guardar { background: var(--lila); }
  .podio-cat { margin-top: 16px; }
  .podio-cat h4 { font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; color: var(--malva); margin-bottom: 6px; }
  .podio-fila { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--fondo); margin-top: 4px; font-size: 15px; }
  .podio-fila .p { font-family: "Oswald", sans-serif; color: var(--suave); text-align: center; }
  .podio-fila.top .p { color: var(--oro); }
  .podio-fila .pt { font-weight: 800; color: var(--lila); }
  .rev { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--fondo); margin-top: 4px; font-size: 15px; }
  .rev .p { font-family: "Oswald", sans-serif; color: var(--suave); text-align: center; }
  .rev .n { min-width: 0; overflow-wrap: anywhere; }
  .rev .n small { display: block; margin-left: 0; }
  .rev .n small { color: var(--suave); margin-left: 6px; }
  .rev .pt { font-weight: 800; color: var(--lila); white-space: nowrap; }
  .rev .rv { font-size: 11px; font-weight: 700; color: var(--malva); text-transform: uppercase; letter-spacing: .06em; margin-left: 6px; }
  .rev button.ed.ok { color: #3ddc84; border-color: rgba(61,220,132,.45); }
  .validar-todos { margin-top: 12px; width: 100%; background: rgba(61,220,132,.12); color: #3ddc84; border: 1px solid rgba(61,220,132,.45); border-radius: 12px; padding: 12px; font-weight: 800; font-size: 15px; }
  .rev button.ed { background: none; border: 1px solid var(--borde); color: var(--texto); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-left: 8px; }
  .editor { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .editor input, .editor select { padding: 10px; font-size: 15px; }
  .editor .btns { grid-column: 1 / -1; display: flex; gap: 8px; }
  .editor .btns button { flex: 1; border-radius: 10px; padding: 10px; font-weight: 700; border: 1px solid var(--borde); background: none; color: var(--texto); }
  .editor .btns .si { background: var(--lila); color: #1f2125; border-color: var(--lila); }
  .editor .btns .borrar { color: var(--error); border-color: color-mix(in srgb, var(--error) 50%, transparent); }
  .editor .ayuda { grid-column: 1 / -1; color: var(--suave); font-size: 12px; }
  .cerrado-ok { margin-top: 12px; color: #3ddc84; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <div class="marca" id="box">Olympo Box</div>
    <h1>Publicar WOD</h1>
    <div class="sub" id="fecha"></div>
  </header>

  <div class="cuenta-barra" id="barraCuenta" hidden style="margin-top:18px">
    <span class="quien">Coach: <b id="quienNombre"></b></span>
    <button type="button" class="salir" id="salir">Salir</button>
  </div>
  <div id="acceso" hidden style="margin-top:18px"></div>

  <div id="zonaCoach" hidden>
  <nav class="pestanas" id="pestanas" aria-label="Clase"></nav>

  <form class="panel" id="formWod" autocomplete="off">
    <div class="estado-wod" id="estadoWod">Sin publicar</div>
    <label for="wNombre">Nombre del entrenamiento <span style="text-transform:none;letter-spacing:0;font-weight:400">(opcional)</span></label>
    <input id="wNombre" maxlength="60" placeholder="Ej. Fran, Cindy, 21-15-9…">
    <label for="wTipo">Cómo se puntúa</label>
    <select id="wTipo">
      <option value="tiempo">Por tiempo (menos es mejor)</option>
      <option value="rondas">AMRAP: rondas + reps (más es mejor)</option>
      <option value="kg">Carga en kg (más es mejor)</option>
    </select>
    <label for="wDesc">El entrenamiento (lo que se ve en pantalla)</label>
    <textarea id="wDesc" maxlength="1000" placeholder="For time&#10;50 wall ball&#10;15/12 rmu/ring pull up&#10;res 2 min&#10;35 wall ball&#10;10/8 rmu"></textarea>
    <div class="acciones">
      <button class="guardar" id="guardar" type="submit">Publicar</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </form>

  <section class="panel cierre" id="cierre">
    <div class="cierre-titulo" id="cierreTitulo">Resultados de hoy</div>
    <p class="cierre-texto" id="cierreTexto"></p>
    <div id="revision"></div>
    <div class="msg" id="msgCierre" role="status"></div>
  </section>

  <div class="resumen" id="resumen"></div>

  <div class="enlaces">
    <a id="linkPantalla" href="pantalla.html">Ver en la pantalla <span>pantalla.html</span></a>
    <a id="linkRanking" href="ranking.html">Ver el ranking <span>ranking.html</span></a>
    <a href="puntos.html">Ranking de puntos <span>puntos.html</span></a>
  </div>
  </div>
</main>

<script type="module">
import { doc, onSnapshot, setDoc, updateDoc, deleteDoc, collection, query, where, getDoc, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, hoy, TIPOS, CLASES, idWod, claseInicial, recordarClase, ponerColorClase, crearPestanas, claseDe, calcularPuntos, idCierre, formatearValor, PUNTOS, fmtPuntos, leerValor, escribirValor, idRegistro } from "./comun.js";
import { cerrarDiasPendientes } from "./cierre.js";
import { montarMenu } from "./menu.js";
const menu = montarMenu({ actual: "publicar", cuenta: false });
import { escucharCuenta, montarAcceso, salir } from "./cuenta.js";
import { NOMBRE_BOX } from "./config.js";

const $ = (id) => document.getElementById(id);
$("box").textContent = NOMBRE_BOX;
$("fecha").textContent = "Entrenamientos de hoy · " + new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });

let clase = claseInicial();

// Solo el coach puede publicar y cerrar el día (lo comprueban las reglas de Firebase)
montarAcceso($("acceso"), { titulo: "Entra con la cuenta del coach", texto: "Solo la cuenta del coach puede publicar los entrenamientos y repartir los puntos." });
$("salir").addEventListener("click", () => salir());
escucharCuenta(({ user }) => {
  $("acceso").hidden = !!user;
  $("barraCuenta").hidden = !user;
  $("zonaCoach").hidden = !user;
  if (user) { $("quienNombre").textContent = user.email; cerrarDiasPendientes(); }
});
const publicados = {};   // WOD guardado de cada clase
let editado = false;     // si hay cambios sin publicar en la clase actual

// Resumen de las tres clases, siempre al día
for (const clave of Object.keys(CLASES)) {
  onSnapshot(doc(db, "wods", idWod(clave)), (snap) => {
    publicados[clave] = snap.exists() ? snap.data() : null;
    pintarResumen();
    if (clave === clase && !editado) rellenar();
    if (clave === clase) pintarRevision();
  }, (err) => console.warn(err));
}

function pintarResumen() {
  const cont = $("resumen");
  cont.replaceChildren();
  for (const [clave, c] of Object.entries(CLASES)) {
    const w = publicados[clave];
    const fila = document.createElement("div"); fila.className = "fila-resumen";
    const b = document.createElement("b"); b.textContent = c.nombre; b.style.color = c.color;
    const s = document.createElement("span");
    s.textContent = w ? `✓ Publicado · ${TIPOS[w.tipo]?.etiqueta || ""}${w.nombre && !w.nombre.endsWith(" del día") ? " · " + w.nombre : ""}` : "Sin publicar";
    fila.append(b, s);
    cont.append(fila);
  }
}

function rellenar() {
  const w = publicados[clase];
  $("wNombre").value = w?.nombre && !w.nombre.endsWith(" del día") ? w.nombre : "";
  $("wTipo").value = w?.tipo || "tiempo";
  $("wDesc").value = w?.descripcion || "";
  $("estadoWod").textContent = w ? `${CLASES[clase].nombre}: publicado` : `${CLASES[clase].nombre}: sin publicar`;
  $("estadoWod").classList.toggle("publicado", !!w);
  $("guardar").textContent = w ? `Actualizar ${CLASES[clase].nombre}` : `Publicar ${CLASES[clase].nombre}`;
  editado = false;
}

for (const id of ["wNombre", "wTipo", "wDesc"]) $(id).addEventListener("input", () => { editado = true; $("msg").textContent = ""; });

function cambiarClase(nueva) {
  if (editado && !confirmarCambio()) {
    crearPestanas($("pestanas"), clase, cambiarClase);  // vuelve a marcar la pestaña actual
    return;
  }
  clase = nueva;
  recordarClase(clase);
  ponerColorClase(clase);
  menu.repintar();
  $("linkPantalla").href = "pantalla.html?clase=" + clase;
  $("linkRanking").href = "ranking.html?clase=" + clase;
  $("msg").textContent = "";
  editado = false;
  rellenar();
  escucharCierre();
}

// ---------- Resultados de hoy: el coach puede corregir o borrar cualquiera ----------
// Los puntos se reparten solos a las 00:00 (ver cierre.js); hasta entonces se puede corregir todo.
let cierre = null, dejarCierre = null, dejarRes = null, resHoy = [], abierto = null;
function escucharCierre() {
  if (dejarCierre) dejarCierre();
  if (dejarRes) dejarRes();
  cierre = null; resHoy = []; abierto = null;
  $("msgCierre").textContent = "";
  dejarCierre = onSnapshot(doc(db, "cierres", idCierre(clase)), (s) => { cierre = s.exists() ? s.data() : null; pintarRevision(); }, () => {});
  dejarRes = onSnapshot(query(collection(db, "resultados"), where("fecha", "==", hoy())), (s) => {
    resHoy = s.docs.map((d) => ({ id: d.id, ...d.data() })).filter((r) => claseDe(r) === clase && r.uid);
    pintarRevision();
  }, () => {});
}

function pintarRevision() {
  const n = CLASES[clase].nombre;
  const w = publicados[clase];
  $("cierreTitulo").textContent = `Resultados de hoy · ${n}`;
  const p = PUNTOS.podio;
  $("cierreTexto").textContent = cierre
    ? `${n} de hoy ya está cerrado: se han repartido ${fmtPuntos(cierre.puntosTotales)} puntos entre ${cierre.socios} socios.`
    : `Los ${PUNTOS.registrar} puntos de registrar se suman al momento; los del podio se reparten solos a las 00:00 con lo que haya aquí. Si alguien ha puesto un resultado falso, corrígelo o bórralo antes. Podio: RX +${p.RX[1]}/+${p.RX[2]}/+${p.RX[3]}, Scaled +${p.Scaled[1]}/+${p.Scaled[2]}/+${p.Scaled[3]}, Open +${fmtPuntos(p.Open[1])}/+${p.Open[2]}/+${fmtPuntos(p.Open[3])}; y ${PUNTOS.registrar} por registrar.`;
  const cont = $("revision"); cont.replaceChildren();
  if (!w) { cont.append(Object.assign(document.createElement("p"), { className: "cierre-texto", textContent: "Publica el entrenamiento de esta clase para que los socios puedan subir su resultado." })); return; }
  const filas = calcularPuntos(resHoy, w.tipo);
  if (!filas.length) { cont.append(Object.assign(document.createElement("p"), { className: "cierre-texto", textContent: "Todavía no hay resultados." })); return; }
  for (const cat of ["RX", "Scaled", "Open"]) {
    const deCat = filas.filter((f) => f.categoria === cat);
    if (!deCat.length) continue;
    const bloque = document.createElement("div"); bloque.className = "podio-cat";
    bloque.append(Object.assign(document.createElement("h4"), { textContent: cat }));
    for (const f of deCat) bloque.append(filaRevision(f, w.tipo));
    cont.append(bloque);
  }
  // Validar de una vez todos los que faltan
  const pendientes = resHoy.filter((r) => !r.validado);
  if (!cierre && pendientes.length) {
    const b = Object.assign(document.createElement("button"), { type: "button", className: "validar-todos", textContent: `✓ Validar todos (${pendientes.length})` });
    b.addEventListener("click", async () => {
      b.disabled = true;
      try {
        const lote = writeBatch(db);
        pendientes.forEach((r) => lote.update(doc(db, "resultados", r.id), { validado: true }));
        await lote.commit();
        $("msgCierre").className = "msg ok"; $("msgCierre").textContent = `✓ ${pendientes.length} resultados validados.`;
      } catch (e) { console.error(e); $("msgCierre").className = "msg error"; $("msgCierre").textContent = "No se han podido validar."; b.disabled = false; }
    });
    cont.append(b);
  }
}

function filaRevision(f, tipo) {
  const r = f.r;
  const fila = document.createElement("div"); fila.className = "rev";
  const p = Object.assign(document.createElement("span"), { className: "p", textContent: f.posicion + "º" });
  const nm = document.createElement("span"); nm.className = "n";
  nm.append(r.nombre, Object.assign(document.createElement("small"), { textContent: formatearValor(r.valor, r.tipo) }));
  if (r.revisado) nm.append(Object.assign(document.createElement("span"), { className: "rv", textContent: "corregido" }));
  else if (r.validado) nm.append(Object.assign(document.createElement("span"), { className: "rv", textContent: "validado" }));
  const der = document.createElement("span");
  der.append(Object.assign(document.createElement("span"), { className: "pt", textContent: "+" + fmtPuntos(f.puntos) }));
  if (!cierre && !r.validado) {
    const va = Object.assign(document.createElement("button"), { type: "button", className: "ed ok", textContent: "✓ Validar" });
    va.addEventListener("click", async () => {
      try { await updateDoc(doc(db, "resultados", r.id), { validado: true }); $("msgCierre").className = "msg ok"; $("msgCierre").textContent = `✓ Resultado de ${r.nombre} validado.`; }
      catch (e) { console.error(e); $("msgCierre").className = "msg error"; $("msgCierre").textContent = "No se ha podido validar."; }
    });
    der.append(va);
  }
  if (!cierre) {
    const ed = Object.assign(document.createElement("button"), { type: "button", className: "ed", textContent: "Editar" });
    ed.addEventListener("click", () => { abierto = abierto === r.id ? null : r.id; pintarRevision(); });
    der.append(ed);
  }
  fila.append(p, nm, der);
  if (abierto === r.id && !cierre) fila.append(editor(r, tipo));
  return fila;
}

function editor(r, tipo) {
  const box = document.createElement("div"); box.className = "editor";
  const sel = document.createElement("select");
  for (const c of ["RX", "Scaled", "Open"]) sel.append(new Option(c, c, false, c === r.categoria));
  sel.setAttribute("aria-label", "Categoría");
  const val = Object.assign(document.createElement("input"), { value: escribirValor(r.valor, tipo) });
  val.setAttribute("aria-label", "Resultado");
  const ayuda = Object.assign(document.createElement("div"), { className: "ayuda",
    textContent: tipo === "tiempo" ? "Resultado en minutos:segundos, p. ej. 9:12" : tipo === "rondas" ? "Rondas+reps, p. ej. 5+12" : "Kilos, p. ej. 85" });
  const btns = document.createElement("div"); btns.className = "btns";
  const guardar = Object.assign(document.createElement("button"), { type: "button", className: "si", textContent: "Guardar" });
  const borrar = Object.assign(document.createElement("button"), { type: "button", className: "borrar", textContent: "Borrar" });
  const cancelar = Object.assign(document.createElement("button"), { type: "button", textContent: "Cancelar" });
  const m = $("msgCierre");
  guardar.addEventListener("click", async () => {
    const v = leerValor(val.value, tipo);
    if (isNaN(v)) { m.className = "msg error"; m.textContent = "Revisa el resultado: " + ayuda.textContent; return; }
    try {
      await updateDoc(doc(db, "resultados", r.id), { categoria: sel.value, valor: v, revisado: true, validado: true });
      abierto = null; m.className = "msg ok"; m.textContent = `✓ Resultado de ${r.nombre} corregido.`;
    } catch (e) { console.error(e); m.className = "msg error"; m.textContent = "No se ha podido guardar (¿el día ya está cerrado?)."; }
  });
  let confirmar = false;
  borrar.addEventListener("click", async () => {
    if (!confirmar) { confirmar = true; borrar.textContent = "¿Seguro? Pulsa otra vez"; return; }
    try {
      // Borra el resultado y le quita los puntos de registrar que se le sumaron al subirlo
      const lote = writeBatch(db);
      lote.delete(doc(db, "resultados", r.id));
      const regRef = doc(db, "usuarios", r.uid, "movimientos", idRegistro(clase));
      if ((await getDoc(regRef)).exists()) {
        lote.delete(regRef);
        lote.update(doc(db, "usuarios", r.uid), { puntos: increment(-PUNTOS.registrar) });
      }
      await lote.commit();
      abierto = null; m.className = "msg ok"; m.textContent = `✓ Resultado de ${r.nombre} borrado y sus ${PUNTOS.registrar} puntos de registrar descontados.`;
    }
    catch (e) { console.error(e); m.className = "msg error"; m.textContent = "No se ha podido borrar."; }
  });
  cancelar.addEventListener("click", () => { abierto = null; pintarRevision(); });
  btns.append(guardar, borrar, cancelar);
  box.append(sel, val, ayuda, btns);
  return box;
}

$("formWod").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nombre = $("wNombre").value.trim() || `${CLASES[clase].nombre} del día`;
  const descripcion = $("wDesc").value.replace(/\r/g, "").trim().toUpperCase().slice(0, 1000);
  $("guardar").disabled = true;
  try {
    await setDoc(doc(db, "wods", idWod(clase)), { nombre, tipo: $("wTipo").value, descripcion });
    editado = false;
    $("msg").className = "msg ok";
    $("msg").textContent = `✓ ${CLASES[clase].nombre} publicado. Ya sale en la pantalla.`;
  } catch (err) {
    console.error(err);
    $("msg").className = "msg error";
    $("msg").textContent = err?.code === "permission-denied" ? "No se ha podido publicar: solo la cuenta del coach puede hacerlo." : "No se ha podido publicar. Revisa la conexión.";
  } finally {
    $("guardar").disabled = false;
  }
});

crearPestanas($("pestanas"), clase, cambiarClase);
cambiarClase(clase);

// A medianoche recarga para empezar el día nuevo
const ahora = new Date();
const manana = new Date(ahora); manana.setHours(24, 1, 0, 0);
setTimeout(() => location.reload(), manana - ahora);
</script>
</body>
</html>
